<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mis Finanzas</title>

<!-- Bootstrap (estilos e íconos), igual que en la versión Django -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<!-- React (sin proceso de build: se usa directo desde el navegador) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- Babel: traduce el JSX (el HTML mezclado con JS) a JavaScript normal,
     en el navegador de quien visita la página. Por eso no hace falta
     "compilar" nada antes de subir esto a GitHub Pages. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<!-- Cliente de Supabase (nuestra base de datos en la nube) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Chart.js, para los gráficos del dashboard -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="root">
    <div class="boot-loading">Cargando…</div>
</div>

<!-- Nuestro código, en orden: primero lo compartido, después cada
     pantalla, y app.js al final porque es el que arma todo junto. -->
<script src="js/supabase-client.js"></script>
<script type="text/babel" src="js/utils.js"></script>
<script type="text/babel" src="js/api.js"></script>
<script type="text/babel" src="js/components/Nav.js"></script>
<script type="text/babel" src="js/components/Auth.js"></script>
<script type="text/babel" src="js/components/Dashboard.js"></script>
<script type="text/babel" src="js/components/Categories.js"></script>
<script type="text/babel" src="js/components/Transactions.js"></script>
<script type="text/babel" src="js/components/Budgets.js"></script>
<script type="text/babel" src="js/components/Debts.js"></script>
<script type="text/babel" src="js/components/DebtDetail.js"></script>
<script type="text/babel" src="js/app.js"></script>

</body>
</html>
